<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแลระบบ (Admin Login) - อาคารเรียนรวม 80 ปี</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
    
    <!-- Header -->
    <div class="bg-[#0f2c23] p-6 text-white text-center relative">
      <div class="w-16 h-16 bg-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-slate-900">
        <i class="fa-solid fa-user-shield text-3xl"></i>
      </div>
      <h1 class="text-xl font-bold leading-tight">ระบบผู้ดูแลระบบ (Admin)</h1>
      <p class="text-xs text-gray-300 mt-1">อาคารเรียนรวม 80 ปี มหาวิทยาลัยแม่โจ้</p>
    </div>

    <!-- Form -->
    <div class="p-6 md:p-8">
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">ชื่อผู้ใช้งาน (User / Email)</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้หรืออีเมล" class="w-full pl-9 pr-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">รหัสผ่าน (Password)</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="password" id="password" required placeholder="กรอกรหัสผ่าน" class="w-full pl-9 pr-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>

        <!-- Alert Message -->
        <div id="alertMsg" class="hidden text-xs p-3 rounded-lg border"></div>

        <button type="submit" id="loginBtn" class="w-full bg-[#0d5c46] hover:bg-[#0a4837] text-white py-2.5 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-md">
          <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
        </button>

      </form>

      <div class="mt-6 text-center border-t pt-4">
        <a href="index.html" class="text-xs text-gray-500 hover:text-emerald-700 font-medium transition inline-flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลักผู้ใช้งานทั่วไป
        </a>
      </div>
    </div>

  </div>

  <script>
    // รวม API URL ทั้งสองรายการเพื่อค้นหาข้อมูลบัญชีผู้ใช้
    const API_URLS = [
      "https://sheetdb.io/api/v1/7rirkbi9k7jjc",
      "https://sheetdb.io/api/v1/bmqrbho6swze2"
    ];

    async function handleLogin(e) {
      e.preventDefault();

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> กำลังตรวจสอบข้อมูล...';

      let isSuccess = false;
      let profileName = "";

      // 1. ตรวจสอบข้อมูลจาก SheetDB API
      for (const apiUrl of API_URLS) {
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) continue;

          const users = await response.json();

          if (Array.isArray(users) && users.length > 0) {
            const foundUser = users.find(u => {
              const userVal = String(u.User || u.user || u.Username || u.username || u["ชื่อผู้ใช้"] || u.email || u["อีเมล"] || "").trim();
              const passVal = String(u.Password || u.password || u.Pass || u.pass || u["รหัสผ่าน"] || "").trim();

              return userVal === usernameInput && passVal === passwordInput;
            });

            if (foundUser) {
              isSuccess = true;
              profileName = foundUser.Name || foundUser.name || foundUser["ชื่อ"] || foundUser.Username || usernameInput;
              break;
            }
          }
        } catch (error) {
          console.warn("API Fetch error:", error);
        }
      }

      // 2. สำรองข้อมูลบัญชีฉุกเฉิน (Fallback Direct Login)
      if (!isSuccess) {
        if (usernameInput === "admin80y" && passwordInput === "admin80y") {
          isSuccess = true;
          profileName = "ผู้ดูแลอาคาร 80 ปี";
        }
      }

      // 3. จัดการ Session และย้ายหน้าเมื่อสำเร็จ
      if (isSuccess) {
        showAlert(`เข้าสู่ระบบสำเร็จ กำลังนำคุณไปยังหน้าผู้ดูแลระบบ...`, 'success');

        // เซ็ตสิทธิ์การเข้าใช้งาน
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        sessionStorage.setItem('adminUser', profileName);

        setTimeout(() => {
          window.location.replace('admin.html');
        }, 600);

      } else {
        showAlert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ';
      }
    }

    function showAlert(msg, type) {
      const alertMsg = document.getElementById('alertMsg');
      alertMsg.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');

      if (type === 'success') {
        alertMsg.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
      } else {
        alertMsg.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      }
      alertMsg.innerHTML = msg;
    }
  </script>
</body>
</html>
