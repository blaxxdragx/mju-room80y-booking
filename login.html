<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแล - อาคารเรียนรวม 80 ปี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between items-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden my-auto">
    <div class="bg-[#0f2c23] text-white p-6 text-center space-y-2">
      <div class="inline-flex bg-amber-500 p-3 rounded-xl text-slate-900 shadow-md">
        <i class="fa-solid fa-user-lock text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold">เข้าสู่ระบบผู้ดูแลระบบ</h1>
      <p class="text-xs text-gray-300">อาคารเรียนรวม 80 ปี มหาวิทยาลัยแม่โจ้</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4 text-sm">
      <div>
        <label class="block font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน (User)</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="loginUsername" required placeholder="กรอก Username เช่น admin80y" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-medium transition shadow flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
      </button>

      <div class="text-center pt-2">
        <a href="index.html" class="text-xs text-emerald-700 hover:underline flex items-center justify-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลักผู้ใช้งาน
        </a>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="w-full text-center py-4 text-xs text-gray-500 border-t bg-white">
    <p>&copy; 2026 อาคารเรียนรวม 80 ปี มหาวิทยาลัยแม่โจ้. All rights reserved.</p>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzWpTA19Njd637bGpV16qoVPoAAxuZtkKD9LzqVpPyRk6vBd2HFdGKPH4-jFNrXbUW7/exec";

    async function handleLogin(e) {
      e.preventDefault();
      const inputUser = document.getElementById('loginUsername').value.trim();
      const inputPass = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> กำลังตรวจสอบ...';

      try {
        const response = await fetch(`${API_URL}?type=users`);
        const users = await response.json();

        if (Array.isArray(users)) {
          const matchedUser = users.find(u => {
            const uUser = String(u.User || u.user || "").trim();
            const uPass = String(u.Password || u.password || "").trim();
            return uUser === inputUser && uPass === inputPass;
          });

          if (matchedUser) {
            const name = matchedUser.Name || matchedUser.name || "ผู้ดูแลระบบ";
            const role = matchedUser.Type || matchedUser.type || matchedUser.Role || "admin";

            sessionStorage.setItem("isAdminLoggedIn", "true");
            sessionStorage.setItem("adminUser", name);
            sessionStorage.setItem("userRole", role.toLowerCase());

            alert("เข้าสู่ระบบสำเร็จ!");
            window.location.href = "admin.html";
          } else {
            alert("ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง");
          }
        } else {
          alert("ไม่พบข้อมูลผู้ใช้งานในระบบ");
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ';
      }
    }
  </script>
</body>
</html>
